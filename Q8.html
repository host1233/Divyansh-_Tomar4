    <h1>
        Returning an object froma function

    <script>
        function create(name,age)
        {
            return{
                Name:name,
                Age:age,
            };
        }


        let student=create(
  (prompt("plz enter your name:")),
             Number (prompt("plz enter your  age:")),
    );

      console.log(student);
        alert(JSON.stringify(student));
    
      
    </script>
